<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لأميرتي 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Markazi+Text:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF1EC;
    --page:#FFFBF8;
    --sidebar:#F7E4E1;
    --ink:#3A2A2C;
    --ink-soft:#8C6B6A;
    --accent:#A6435C;
    --accent-soft:#F6DEE3;
    --teal:#B4863E;
    --teal-soft:#F3E7CF;
    --line:#EFDCD6;
    --bubble:#FFFFFF;
    --good:#7A5230;
    --font-display:"Amiri","Markazi Text",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
    display:flex;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ============ الشريط الجانبي ============ */
  .sidebar{
    width:230px;
    background:var(--sidebar);
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:16px;
    flex-shrink:0;
    transition:margin-right .25s ease;
  }
  .sidebar.collapsed{ margin-right:-230px; }
  .brand{
    font-size:1.05rem;
    font-weight:600;
    padding:0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .new-lesson-btn{
    display:flex;align-items:center;gap:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.9rem;
    cursor:pointer;
    color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .new-lesson-btn:hover{
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transform:translateY(-1px);
  }
  .sidebar-section{
    font-size:0.78rem;
    color:var(--ink-soft);
    padding:0 4px;
    margin-top:6px;
  }
  .sidebar select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:0.85rem;
    margin-top:6px;
  }
  .speed-toggle{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .pill{
    flex:1;
    text-align:center;
    padding:7px 4px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.78rem;
    cursor:pointer;
    color:var(--ink-soft);
    transition:all .15s ease;
  }
  .pill.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .sidebar-footer{
    margin-top:auto;
    font-size:0.72rem;
    color:var(--ink-soft);
    padding:0 4px;
  }
  .saved-lesson-item{
    padding:9px 10px;
    border-radius:8px;
    background:#fff;
    border:1px solid var(--line);
    margin-bottom:6px;
    font-size:0.8rem;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .saved-lesson-item:hover{ transform:translateX(-2px); }
  .saved-lesson-date{
    display:block;
    font-size:0.68rem;
    color:var(--ink-soft);
    margin-top:3px;
  }

  /* ============ منطقة المحادثة ============ */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:var(--page);
  }
  .hero-title{
    font-family:var(--font-display);
    font-size:1.5rem;
    color:var(--accent);
    white-space:nowrap;
    letter-spacing:.3px;
  }
  .menu-btn{
    background:none;border:none;cursor:pointer;
    font-size:1.1rem;color:var(--ink-soft);
    padding:4px 8px;border-radius:6px;
  }
  .menu-btn:hover{background:var(--sidebar);}
  .progress-track{
    flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent);width:0%;
    transition:width .4s ease;
  }

  .chat-area{
    flex:1;
    overflow-y:auto;
    padding:24px 0 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(ellipse at 15% 0%, var(--accent-soft) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 100%, var(--teal-soft) 0%, transparent 40%),
      var(--bg);
  }
  .chat-inner{
    width:100%;
    max-width:680px;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* الشاشة الترحيبية (الحالة الأولية) */
  .welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:6px;
    padding-bottom:40px;
  }
  .welcome-flourish{
    font-size:1.8rem;
    color:var(--teal);
    margin-bottom:6px;
  }
  .welcome h2{
    font-family:var(--font-display);
    font-size:1.9rem;
    margin:0;
    font-weight:700;
    color:var(--ink);
  }
  .welcome p{
    color:var(--ink-soft);
    font-size:0.95rem;
    margin:6px 0 10px;
    font-family:system-ui,sans-serif;
  }

  /* رسائل الدرس */
  .msg{
    display:flex;
    gap:12px;
    animation:fadeUp .35s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:0.85rem;
    margin-top:2px;
    box-shadow:0 2px 6px rgba(166,67,92,.25);
  }
  .msg-body{
    flex:1;
    line-height:1.95;
    font-size:1.08rem;
    font-family:var(--font-display);
    padding-top:2px;
    position:relative;
  }
  .msg:not(.user) .msg-body{
    background:var(--page);
    border:1px solid var(--line);
    border-right:4px solid var(--line);
    border-radius:4px 14px 14px 4px;
    padding:16px 20px;
    box-shadow:0 2px 10px rgba(166,67,92,.05);
  }
  .msg.key_idea:not(.user) .msg-body{ border-right-color:var(--accent); background:var(--accent-soft); }
  .msg.solution_method:not(.user) .msg-body{ border-right-color:var(--teal); background:var(--teal-soft); }
  .msg.user .msg-body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  }
  .step-label{
    font-family:system-ui,sans-serif;
    font-size:0.72rem;
    color:var(--accent);
    font-weight:700;
    margin-bottom:6px;
    letter-spacing:.3px;
  }
  .step-para{ margin:0 0 12px; }
  .step-para:last-child{ margin-bottom:0; }
  .step-list{ margin:8px 0 12px; padding-inline-start:24px; }
  .step-list li{ margin-bottom:6px; }
  .step-divider{ border:none; border-top:1px dashed var(--line); margin:14px 0; }

  .hl-target{
    position:relative;
    z-index:1;
    font-weight:700;
    color:var(--ink);
  }
  .annotation-svg{
    position:absolute;
    left:0; top:0;
    overflow:visible;
    pointer-events:none;
    z-index:0;
  }
  .annotation-circle{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.5;
  }
  .annotation-arrow{
    fill:none;
    stroke:var(--accent);
    stroke-width:2;
  }
  .msg-body .cursor{
    display:inline-block;width:2px;height:1em;
    background:var(--ink);vertical-align:middle;
    animation:blink 1s step-start infinite;
    margin-inline-start:2px;
  }
  @keyframes blink{50%{opacity:0;}}
  .msg.user .avatar{background:var(--ink-soft);}
  .msg.user .msg-body{color:var(--ink);}

  .typing-dots{
    display:flex;gap:4px;align-items:center;height:24px;
  }
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:.5;}
    30%{transform:translateY(-5px); opacity:1;}
  }

  /* بطاقة انتظار مميزة (تحضير الشرح / إعادة المحاولة) */
  .loading-card{
    display:flex;align-items:center;gap:10px;
    background:var(--accent-soft);
    border:1px solid #E4C6B6;
    border-radius:14px;
    padding:10px 16px;
    max-width:340px;
    animation:fadeUp .25s ease both;
  }
  .loading-icon{
    font-size:1.25rem;
    flex-shrink:0;
    animation:loadingPulse 1.4s ease-in-out infinite;
  }
  @keyframes loadingPulse{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.18) rotate(-8deg);}
  }
  .loading-text{
    font-size:0.88rem;
    color:var(--ink);
    line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  }

  /* بطاقة التوقف التفاعلية */
  .pause-card{
    margin-inline-start:40px;
    background:var(--accent-soft);
    border:1px solid #E4C6B6;
    border-radius:12px;
    padding:14px 16px;
    animation:fadeUp .3s ease both;
  }
  .pause-card p{margin:0 0 10px;font-size:0.92rem;font-weight:600;}
  .pause-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.85rem;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .chip:hover{transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .chip:active{transform:translateY(0);}
  .chip.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* منطقة الإدخال السفلية (زي صندوقك) */
  .composer-wrap{
    padding:14px 20px 20px;
    display:flex;
    justify-content:center;
    background:var(--page);
  }
  .composer{
    width:100%;
    max-width:680px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:8px 10px 8px 8px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    box-shadow:0 2px 12px rgba(166,67,92,.08);
    transition:box-shadow .2s ease;
  }
  .composer:focus-within{
    box-shadow:0 2px 16px rgba(166,67,92,.16);
    border-color:var(--accent-soft);
  }
  .plus-btn{
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    font-size:1.2rem;
    cursor:pointer;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .plus-btn:hover{background:var(--accent-soft); transform:scale(1.05);}
  .composer textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-family:inherit;
    font-size:0.95rem;
    padding:8px 4px;
    max-height:120px;
    background:transparent;
  }
  .send-btn{
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    transition:background .15s ease, transform .1s ease;
  }
  .send-btn:disabled{background:var(--line); cursor:not-allowed;}
  .send-btn:not(:disabled):hover{background:var(--good);}
  .send-btn:not(:disabled):active{transform:scale(.92);}

  .thumbs-strip{
    display:flex;gap:6px;flex-wrap:wrap;
    padding:0 6px 6px;
    max-height:130px;
    overflow-y:auto;
  }
  .thumbs-strip img{
    width:44px;height:56px;object-fit:cover;
    border-radius:6px;border:1px solid var(--line);
  }

  .error-box{
    background:#FBEAE7;
    border:1px solid #C0503B;
    color:#8A3B2E;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.85rem;
    margin:0 20px;
    max-width:680px;
    align-self:center;
    width:100%;
  }
  .hidden{display:none !important;}

  @media (max-width:720px){
    .sidebar{
      position:fixed;
      top:0; right:0;
      height:100%;
      z-index:40;
      box-shadow:-6px 0 20px rgba(0,0,0,.18);
      transform:translateX(0);
      transition:transform .25s ease;
      margin-right:0 !important;
    }
    .sidebar.collapsed{
      transform:translateX(100%);
      margin-right:0 !important;
    }
    .backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.35);
      z-index:35;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
    }
    .backdrop.show{
      opacity:1;
      pointer-events:auto;
    }
    .composer-wrap{
      padding:10px 12px 14px;
    }
    main, .main{
      width:100%;
    }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A6435C"/>
    </marker>
  </defs>
</svg>

<aside class="sidebar" id="sidebar">
  <div class="brand">💌 لأميرتي</div>
  <button class="new-lesson-btn" id="newLessonBtn">＋ درس جديد</button>

  <div>
    <div class="sidebar-section">اللغة</div>
    <select id="langSelect"></select>
  </div>

  <div>
    <div class="sidebar-section">أسلوب الشرح</div>
    <div class="speed-toggle">
      <div class="pill active" data-speed="detailed">تفصيلي</div>
      <div class="pill" data-speed="fast">سريع</div>
    </div>
  </div>

  <div style="flex:1; overflow-y:auto; min-height:0;">
    <div class="sidebar-section">الدروس المحفوظة</div>
    <div id="savedLessonsList"></div>
  </div>

  <div class="sidebar-footer">صُنع بمحبة 🌷<br>الشرح مبني حصراً على صورك</div>
</aside>

<div class="backdrop" id="backdrop"></div>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="hero-title">لأميرتي 💕</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span id="stepCounter" style="font-family:system-ui,sans-serif;font-size:0.75rem;color:var(--ink-soft);white-space:nowrap;"></span>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
      <div class="welcome" id="welcome">
        <div class="welcome-flourish">✦</div>
        <h2>صوّري درسك، وخليني أشرحلك ياه يا قمر 💗</h2>
        <p>ارفعي صور صفحات الدرس من زر الـ "+" تحت وبعدين اضغطي إرسال</p>
      </div>
    </div>
  </div>

  <div id="errorSlot"></div>

  <div class="composer-wrap">
    <div style="width:100%; max-width:680px;">
      <div class="thumbs-strip" id="thumbsStrip"></div>
      <div class="composer">
        <button class="plus-btn" id="plusBtn" title="ارفع صور الدرس">＋</button>
        <input type="file" id="imgInput" accept="image/*" multiple class="hidden">
        <textarea id="mainInput" rows="1" placeholder="صوّري درسك وابعتيلي ياه... أو اكتبيلي سؤالك 💕"></textarea>
        <button class="send-btn" id="sendBtn" disabled>↑</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ إعدادات أساسية ============ */
const API_KEYS = [
  atob("c2stb3ItdjEtOTUxYjUyMWM5ZDgzNTFmYTgzOWIyMThmZjFhYzhlZThjNmIxODEyYTNmMzA3Njc2MjUxM2E1MTUyODJlODNkYQ==")
];
let apiKeyIndex = 0;
const MODEL = "google/gemma-3-27b-it:free"; // موديل مجاني تاني، عادة أفضل بالالتزام باللغة المطلوبة بدون خبص
const API_URL = `https://openrouter.ai/api/v1/chat/completions`;

/* ============ اللغات ============ */
const LANGUAGES = [
  {code:"ar", name:"العربية", speech:"ar-SA", rtl:true},
  {code:"en", name:"English", speech:"en-US", rtl:false},
  {code:"fr", name:"Français", speech:"fr-FR", rtl:false},
  {code:"es", name:"Español", speech:"es-ES", rtl:false},
  {code:"tr", name:"Türkçe", speech:"tr-TR", rtl:false},
  {code:"de", name:"Deutsch", speech:"de-DE", rtl:false},
  {code:"ru", name:"Русский", speech:"ru-RU", rtl:false},
  {code:"zh", name:"中文", speech:"zh-CN", rtl:false},
  {code:"hi", name:"हिन्दी", speech:"hi-IN", rtl:false},
  {code:"ur", name:"اردو", speech:"ur-PK", rtl:true},
  {code:"pt", name:"Português", speech:"pt-PT", rtl:false},
  {code:"it", name:"Italiano", speech:"it-IT", rtl:false},
  {code:"ja", name:"日本語", speech:"ja-JP", rtl:false},
  {code:"ko", name:"한국어", speech:"ko-KR", rtl:false},
];
const langSelect = document.getElementById("langSelect");
LANGUAGES.forEach(l=>{
  const opt = document.createElement("option");
  opt.value=l.code; opt.textContent=l.name;
  if(l.code==="ar") opt.selected = true;
  langSelect.appendChild(opt);
});
function currentLang(){ return LANGUAGES.find(l=>l.code===langSelect.value) || LANGUAGES[0]; }
function applyDirection(){
  const l = currentLang();
  document.documentElement.dir = l.rtl ? "rtl" : "ltr";
}
langSelect.addEventListener("change", applyDirection);
applyDirection();

/* ============ الشريط الجانبي: طي/فتح + درس جديد ============ */
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");

function toggleSidebar(){
  sidebar.classList.toggle("collapsed");
  backdrop.classList.toggle("show");
}
document.getElementById("menuBtn").addEventListener("click", toggleSidebar);
backdrop.addEventListener("click", toggleSidebar);
document.getElementById("newLessonBtn").addEventListener("click", ()=>{
  resetLesson();
  if(window.innerWidth <= 720){ sidebar.classList.add("collapsed"); backdrop.classList.remove("show"); }
});

// عالموبايل، خلي الشريط الجانبي مطوي بشكل افتراضي
if(window.innerWidth <= 720){
  sidebar.classList.add("collapsed");
}

/* ============ سرعة الشرح ============ */
let speedMode = "detailed";
document.querySelectorAll(".pill[data-speed]").forEach(p=>{
  p.addEventListener("click", ()=>{
    document.querySelectorAll(".pill[data-speed]").forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    speedMode = p.dataset.speed;
  });
});

/* ============ رفع الصور من خلال زر + ============ */
let uploadedImages = [];
const imgInput = document.getElementById("imgInput");
const thumbsStrip = document.getElementById("thumbsStrip");
const sendBtn = document.getElementById("sendBtn");
const mainInput = document.getElementById("mainInput");
const plusBtn = document.getElementById("plusBtn");

plusBtn.addEventListener("click", ()=> imgInput.click());

imgInput.addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files);
  if(files.length===0) return;
  plusBtn.disabled = true;
  const originalPlusLabel = plusBtn.textContent;
  for(let i=0;i<files.length;i++){
    plusBtn.textContent = `${i+1}/${files.length}`;
    try{
      const dataUrl = await compressImage(files[i], 1024, 0.6);
      uploadedImages.push({mimeType:"image/jpeg", data:dataUrl.split(",")[1]});
      const img = document.createElement("img");
      img.src = dataUrl;
      thumbsStrip.appendChild(img);
    }catch(err){
      console.error("تعذر معالجة إحدى الصور:", err);
    }
    updateSendState();
  }
  plusBtn.disabled = false;
  plusBtn.textContent = originalPlusLabel;
  imgInput.value = "";
});

/* يصغّر الصورة ويحوّلها JPEG مضغوط عشان يقدر يرفع كم صفحة مع بعض (حتى لو 15+) من غير ما يتخطى حد حجم الطلب */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const image = new Image();
      image.onload = ()=>{
        let { width, height } = image;
        if(width > maxDim || height > maxDim){
          if(width > height){
            height = Math.round(height * (maxDim/width));
            width = maxDim;
          }else{
            width = Math.round(width * (maxDim/height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      image.onerror = reject;
      image.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// بنحوّل شكل الأجزاء (parts) يلي بالكود (على طراز Gemini: {text} أو {inlineData:{mimeType,data}})
// لشكل OpenAI/OpenRouter (content array: {type:"text"} أو {type:"image_url"})
function partsToOpenRouterContent(parts){
  return parts.map(p=>{
    if(p.inlineData){
      return { type:"image_url", image_url:{ url:`data:${p.inlineData.mimeType};base64,${p.inlineData.data}` } };
    }
    return { type:"text", text:p.text || "" };
  });
}

async function callGemini(parts, onRetry){
  const maxRetries = 3;
  let attempt = 0;
  while(true){
    let res;
    const currentKey = API_KEYS[apiKeyIndex % API_KEYS.length];
    try{
      res = await fetch(API_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization": `Bearer ${currentKey}`
        },
        body:JSON.stringify({
          model: MODEL,
          messages:[{ role:"user", content: partsToOpenRouterContent(parts) }],
          response_format:{ type:"json_object" }
        })
      });
    }catch(networkErr){
      if(attempt < maxRetries){
        attempt++;
        const waitSeconds = attempt*3;
        if(onRetry) onRetry(attempt, maxRetries, waitSeconds);
        await new Promise(r=>setTimeout(r, waitSeconds*1000));
        continue;
      }
      throw new Error("تعذر الاتصال بالإنترنت. تأكدي من الشبكة وحاولي مرة تانية.");
    }
    if(res.ok){
      const data = await res.json();
      return data?.choices?.[0]?.message?.content || "";
    }
    // لو المفتاح الحالي وصل حد الاستخدام (429) وفي أكثر من مفتاح، بدّل عالمفتاح التالي فوراً بدون ما يستهلك محاولة
    if(res.status===429 && API_KEYS.length>1){
      apiKeyIndex++;
      continue;
    }
    const isTemporary = res.status===503 || res.status===429 || res.status===500;
    if(isTemporary && attempt < maxRetries){
      attempt++;
      const waitSeconds = attempt*3;
      if(onRetry) onRetry(attempt, maxRetries, waitSeconds);
      await new Promise(r=>setTimeout(r, waitSeconds*1000));
      continue;
    }
    const t = await res.text();
    throw new Error(`فشل الاتصال (${res.status}). ${t.slice(0,180)}`);
  }
}
function parseStepsJson(text){
  const clean = text.trim().replace(/^```json/,"").replace(/^```/,"").replace(/```$/,"").trim();
  const parsed = JSON.parse(clean);
  if(!parsed.steps || !Array.isArray(parsed.steps)) throw new Error("شكل الرد غير متوقع");
  return parsed.steps;
}

/* ============ عرض خطوات الشرح (بدون صوت) ============ */
function escapeHtmlLite(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inlineFormat(s){
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function renderMarkdownLite(str){
  const lines = str.split(/\n+/);
  let html = "", inList = false, listType = null;
  const closeList = ()=>{ if(inList){ html += listType==="ul" ? "</ul>" : "</ol>"; inList=false; } };
  for(const raw of lines){
    const line = raw.trim();
    if(line === "") continue;
    if(/^-{3,}$/.test(line)){ closeList(); html += `<hr class="step-divider">`; continue; }
    const bulletMatch = line.match(/^[-•]\s+(.*)/);
    const numMatch = line.match(/^\d+[.)]\s+(.*)/);
    if(bulletMatch){
      if(!inList || listType!=="ul"){ closeList(); html += "<ul class='step-list'>"; inList=true; listType="ul"; }
      html += `<li>${inlineFormat(escapeHtmlLite(bulletMatch[1]))}</li>`;
      continue;
    }
    if(numMatch){
      if(!inList || listType!=="ol"){ closeList(); html += "<ol class='step-list'>"; inList=true; listType="ol"; }
      html += `<li>${inlineFormat(escapeHtmlLite(numMatch[1]))}</li>`;
      continue;
    }
    closeList();
    html += `<p class="step-para">${inlineFormat(escapeHtmlLite(line))}</p>`;
  }
  closeList();
  return html;
}

function typeAndSpeak(step){
  const text = typeof step === "string" ? step : step.text;
  const highlight = typeof step === "string" ? "" : (step.highlight || "");
  const stepKind = typeof step === "string" ? "" : (step.type || "");
  const typeLabels = {explanation:"📖 شرح", key_idea:"💗 فكرة رئيسية", solution_method:"🌙 طريقة حل"};
  const label = (typeof step !== "string" && step.type && typeLabels[step.type]) ? typeLabels[step.type] : "";
  return new Promise(resolve=>{
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<div class="avatar">💗</div><div class="msg-body">${label ? `<div class="step-label">${label}</div>` : ""}<div class="step-text"></div></div>`;
    chatInner.appendChild(div);
    const body = div.querySelector(".msg-body");
    const textEl = div.querySelector(".step-text");
    const cursor = document.createElement("span");
    cursor.className = "cursor";

    const speedMs = speedMode==="fast" ? 10 : 18;

    let i=0;
    function tick(){
      if(i<=text.length){
        textEl.textContent = text.slice(0,i);
        textEl.appendChild(cursor);
        i++;
        scrollDown();
        setTimeout(tick, speedMs);
      }else{
        cursor.remove();
        if(highlight){
          const idx = text.indexOf(highlight);
          if(idx !== -1){
            const before = text.slice(0, idx);
            const match = text.slice(idx, idx + highlight.length);
            const after = text.slice(idx + highlight.length);
            textEl.innerHTML = renderMarkdownLite(before) + `<span class="hl-target">${escapeHtmlLite(match)}</span>` + renderMarkdownLite(after);
          } else {
            textEl.innerHTML = renderMarkdownLite(text);
          }
        } else {
          textEl.innerHTML = renderMarkdownLite(text);
        }
        const span = textEl.querySelector(".hl-target");
        if(span){ requestAnimationFrame(()=> annotate(body, span, stepKind)); }
        resolve();
      }
    }
    tick();
  });
}

function sketchyEllipsePath(cx, cy, rx, ry){
  const points = 14;
  const pts = [];
  for(let i=0;i<points;i++){
    const angle = (i/points)*Math.PI*2;
    const jitter = 1 + (Math.sin(i*2.7)*0.04);
    pts.push([cx + Math.cos(angle)*rx*jitter, cy + Math.sin(angle)*ry*jitter]);
  }
  let d = `M ${pts[0][0]} ${pts[0][1]} `;
  for(let i=1;i<=points;i++){
    const p = pts[i % points];
    const prev = pts[i-1];
    const midX = (prev[0]+p[0])/2, midY = (prev[1]+p[1])/2;
    d += `Q ${prev[0]} ${prev[1]}, ${midX} ${midY} `;
  }
  return d + "Z";
}

function sketchyUnderlinePath(x1, y, x2, jitterSeed){
  const segments = 6;
  const amp = 4;
  let d = `M ${x1} ${y} `;
  for(let i=1;i<=segments;i++){
    const x = x1 + ((x2-x1)*i)/segments;
    const wobble = Math.sin(i*1.8 + jitterSeed) * amp;
    d += `Q ${x1 + ((x2-x1)*(i-0.5))/segments} ${y+wobble}, ${x} ${y} `;
  }
  return d;
}

function annotate(container, targetSpan, kind){
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "annotation-svg");

  const cRect = container.getBoundingClientRect();
  const sRect = targetSpan.getBoundingClientRect();
  svg.style.width = container.scrollWidth + "px";
  svg.style.height = (container.scrollHeight + 40) + "px";
  container.appendChild(svg);

  const cx = (sRect.left - cRect.left) + sRect.width/2;
  const cy = (sRect.top - cRect.top) + sRect.height/2;
  const rx = sRect.width/2 + 14;
  const ry = sRect.height/2 + 10;

  const path = document.createElementNS(svgNS, "path");
  if(kind === "solution_method"){
    // خط متموج تحت النص بدل الدائرة، لتنويع طريقة الإبراز حسب نوع الفكرة
    const x1 = (sRect.left - cRect.left) - 4;
    const x2 = (sRect.left - cRect.left) + sRect.width + 4;
    const y = (sRect.top - cRect.top) + sRect.height + 4;
    path.setAttribute("d", sketchyUnderlinePath(x1, y, x2, 1.3));
  } else {
    path.setAttribute("d", sketchyEllipsePath(cx, cy, rx, ry));
  }
  path.setAttribute("class", "annotation-circle");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);

  const circumference = path.getTotalLength();
  path.style.strokeDasharray = circumference;
  path.style.strokeDashoffset = circumference;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    path.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1)";
    path.style.strokeDashoffset = 0;
  }));

  const arrow = document.createElementNS(svgNS, "path");
  const ax1 = cx + rx + 26, ay1 = cy - ry - 30;
  const ax2 = cx + rx*0.3, ay2 = cy - ry - 4;
  arrow.setAttribute("d", `M ${ax1} ${ay1} Q ${ax1-18} ${ay1+22}, ${ax2} ${ay2}`);
  arrow.setAttribute("class", "annotation-arrow");
  arrow.setAttribute("marker-end", "url(#arrowhead)");
  svg.appendChild(arrow);
  const alen = arrow.getTotalLength();
  arrow.style.strokeDasharray = alen;
  arrow.style.strokeDashoffset = alen;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    arrow.style.transition = "stroke-dashoffset .8s cubic-bezier(.65,0,.35,1) .55s";
    arrow.style.strokeDashoffset = 0;
  }));
}

async function playStep(index){
  progressFill.style.width = Math.round(((index)/lessonSteps.length)*100)+"%";
  document.getElementById("stepCounter").textContent = `الخطوة ${index+1} / ${lessonSteps.length}`;
  const step = lessonSteps[index];
  await typeAndSpeak(step);
  progressFill.style.width = Math.round(((index+1)/lessonSteps.length)*100)+"%";

  if(SWEET_MODE && !isReplay){
    await typeAndSpeak({text:getPetPhrase(), highlight:""});
  }

  const needsPause = !isReplay && (step.type==="key_idea" || step.type==="solution_method");
  if(needsPause) showPauseCard(false);
  else advanceStep();
}

function advanceStep(){
  currentStepIndex++;
  if(currentStepIndex < lessonSteps.length){
    playStep(currentStepIndex);
  }else if(isReplay){
    typeAndSpeak({text:"خلصنا استعراض هالدرس 🌷", highlight:""});
  }else{
    showPauseCard(true);
  }
}

  `;

let quizQuestions = [];
let quizIndex = 0;

async function startQuiz(){
  const loadingMsg = addTypingIndicator();
  conversationParts.push({text:`جهزلي 3 أسئلة قصيرة لاختبار فهم الطالب لمحتوى الدرس يلي شرحته، بنفس أسلوب ولغة الشرح (${currentLang().name})${currentLang().code==="ar" ? " وبالعامية" : ""}. أعد JSON فقط بالشكل: {"questions":["سؤال 1","سؤال 2","سؤال 3"]}`});
  try{
    const responseText = await callGemini(conversationParts);
    loadingMsg.remove();
    const clean = responseText.trim().replace(/^```json/,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(clean);
    quizQuestions = parsed.questions || [];
    quizIndex = 0;
    if(quizQuestions.length===0){ showPauseCard(true); return; }
    playQuizQuestion();
  }catch(err){
    loadingMsg.remove();
    showError("ما قدرنا نجهز الأسئلة: "+err.message);
    showPauseCard(true);
  }
}

async function playQuizQuestion(){
  await typeAndSpeak({text: quizQuestions[quizIndex], highlight:""});
  const card = document.createElement("div");
  card.className = "pause-card";
  const isLast = quizIndex >= quizQuestions.length - 1;
  card.innerHTML = `
    <p>اكتبي جوابك بالصندوق تحت، أو دوسي "التالي" لو بدك تكملي.</p>
    <div class="pause-actions">
      <div class="chip primary" data-act="next">${isLast ? "خلصنا الأسئلة" : "السؤال التالي"}</div>
    </div>
  `;
  chatInner.appendChild(card);
  scrollDown();
  mainInput.focus();
  card.querySelector('[data-act="next"]').addEventListener("click", ()=>{
    card.remove();
    quizIndex++;
    if(quizIndex < quizQuestions.length){
      playQuizQuestion();
    }else{
      typeAndSpeak({text:"خلصنا الأسئلة، بالتوفيق بدرسك ❤️", highlight:""});
    }
  });
}

/* ============ إرسال سؤال أثناء الدرس ============ */
async function sendQuestion(){
  const question = mainInput.value.trim();
  if(!question) return;
  addUserMessage(question);
  mainInput.value = "";
  mainInput.style.height = "auto";
  sendBtn.disabled = true;
  clearError();

  conversationParts.push({text:`الطالب سأل: "${question}". جاوب فقط بالاعتماد على محتوى الصور الأصلية وسياق الشرح السابق، بنفس لغة الشرح (${currentLang().name})، بإيجاز ووضوح. أعد JSON فقط: {"answer":"..."}`});

  const loadingMsg = addTypingIndicator("عم فكر بالجواب...");
  try{
    const responseText = await callGemini(conversationParts, (attempt, max, wait)=>{
      updateTypingIndicator(loadingMsg, `سيرفر الذكاء الاصطناعي مزحوم شوي هلأ 😊 عم نعيد المحاولة تلقائياً (${attempt} من ${max})، ثانية وبترجع تشتغل...`);
    });
    loadingMsg.remove();
    const clean = responseText.trim().replace(/^```json/,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(clean);
    await typeAndSpeak(parsed.answer);
    showPauseCard(currentStepIndex >= lessonSteps.length);
  }catch(err){
    loadingMsg.remove();
    showError(friendlyErrorMessage("ما قدرنا نجاوب: ", err));
  }
}

const SWEET_MODE = true; // بتصير true بس بنسخة حبيبتك
const HUMOR_MODE = false; // بتصير true بس بالنسخة العادية
const petPhrases = [
  "يا عمري 😘","يا قلبي ❤️","برافو عليكِ يا روحي 🌷","شاطرة كتير يا حبيبتي 💛",
  "يا الغالية عندي 😍","تسلم إيدك يا قمر ✨","الله يا ذكية 💕","نجمتي إنتِ 🌟",
  "فخور فيكِ كتير 🥹","يا أحلى وحدة بالدنيا 💗","عسل إنتِ 🍯","بموت فيكِ 🫶"
];
function getPetPhrase(){ return petPhrases[Math.floor(Math.random()*petPhrases.length)]; }
const LESSON_STORAGE_KEY = "virtualTeacherLessons";
let isReplay = false;

function getSavedLessons(){
  try{ return JSON.parse(localStorage.getItem(LESSON_STORAGE_KEY) || "[]"); }
  catch(e){ return []; }
}

function saveLessonToStorage(steps){
  if(!steps || steps.length===0) return;
  const list = getSavedLessons();
  const title = (steps[0].text || "درس").slice(0,42);
  list.unshift({
    id: Date.now(),
    title,
    steps,
    lang: currentLang().code,
    speed: speedMode,
    date: new Date().toLocaleDateString("ar-EG", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})
  });
  localStorage.setItem(LESSON_STORAGE_KEY, JSON.stringify(list.slice(0,20)));
  renderSavedLessonsList();
}

function renderSavedLessonsList(){
  const container = document.getElementById("savedLessonsList");
  const list = getSavedLessons();
  if(list.length===0){
    container.innerHTML = `<div style="font-size:0.78rem;color:var(--ink-soft);padding:0 4px;">ولا درس محفوظ لسا</div>`;
    return;
  }
  container.innerHTML = list.map(l=>`
    <div class="saved-lesson-item" data-id="${l.id}">
      ${escapeHtml(l.title)}…
      <span class="saved-lesson-date">${l.date}</span>
    </div>
  `).join("");
  container.querySelectorAll(".saved-lesson-item").forEach(el=>{
    el.addEventListener("click", ()=> loadSavedLesson(el.dataset.id));
  });
}

function loadSavedLesson(id){
  const list = getSavedLessons();
  const lesson = list.find(l => String(l.id) === String(id));
  if(!lesson) return;
  resetLesson();
  isReplay = true;
  lessonStarted = true;
  lessonSteps = lesson.steps;
  currentStepIndex = 0;
  langSelect.value = lesson.lang;
  applyDirection();
  speedMode = lesson.speed;
  document.querySelectorAll(".pill[data-speed]").forEach(p=> p.classList.toggle("active", p.dataset.speed===lesson.speed));
  welcome.classList.add("hidden");
  mainInput.placeholder = "هاد استعراض لدرس سابق (بدون أسئلة)";
  if(window.innerWidth <= 720){ sidebar.classList.add("collapsed"); backdrop.classList.remove("show"); }
  playStep(0);
}

renderSavedLessonsList();
function resetLesson(){
  lessonStarted = false;
  isReplay = false;
  lessonSteps = [];
  currentStepIndex = 0;
  conversationParts = [];
  uploadedImages = [];
  thumbsStrip.innerHTML = "";
  imgInput.value = "";
  mainInput.value = "";
  mainInput.placeholder = "صوّري درسك وابعتيلي ياه... أو اكتبيلي سؤالك 💕";
  chatInner.innerHTML = "";
  chatInner.appendChild(welcome);
  welcome.classList.remove("hidden");
  progressFill.style.width = "0%";
  clearError();
  updateSendState();
}
</script>
